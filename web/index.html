<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimeBank</title>
<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#23201b;--mute:#7a7164;--line:#eadfca;--accent:#e4572e;--accent2:#1f6f5c;--chip:#f3e9d3}
@media (prefers-color-scheme:dark){:root{--bg:#1a1814;--card:#24211c;--ink:#f3ecde;--mute:#a79d8b;--line:#38332a;--chip:#322d24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Iowan Old Style",serif}
h1,h2,h3,button,input,select,textarea,.chip,.num{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px 16px 8px;max-width:1040px;margin:auto;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--accent) 0 25%,var(--accent2) 0 100%);display:grid;place-items:center;color:#fff;font:700 20px system-ui}
h1{margin:0;font-size:26px;letter-spacing:-.5px}
.tag{margin:0;color:var(--mute);font-size:14px}
.wallet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;display:flex;gap:12px;align-items:center}
.num{font-size:28px;font-weight:700;color:var(--accent2)}
main{max-width:1040px;margin:auto;padding:8px 16px 48px;display:grid;gap:20px;grid-template-columns:1fr 320px}
@media(max-width:820px){main{grid-template-columns:1fr}}
section,aside>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
aside{display:grid;gap:20px;align-content:start}
h2{margin:0 0 12px;font-size:17px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;width:100%}
.bar input{flex:1;min-width:140px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.offer{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.offer:first-of-type{border-top:0}
.offer h3{margin:0;font-size:16px}
.offer p{margin:2px 0;color:var(--mute);font-size:14px;grid-column:1}
.meta{font:13px system-ui;color:var(--mute)}
.hrs{font:700 13px system-ui;background:var(--accent);color:#fff;border-radius:99px;padding:3px 10px;white-space:nowrap}
button.btn{background:var(--accent2);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;font-weight:600}
button.btn:disabled{opacity:.5;cursor:default}
button.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
.right{display:grid;justify-items:end;gap:8px;grid-row:1/4;grid-column:2;align-content:start}
form{display:grid;gap:8px}
.row{display:flex;gap:8px}
ul{list-style:none;margin:0;padding:0;font-size:14px}
li{padding:7px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font:14px system-ui;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.empty{color:var(--mute);font-size:14px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:24px;max-width:340px}
dialog::backdrop{background:#0008}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">T</div><div><h1>TimeBank</h1><p class="tag">Teach an hour, learn an hour. Your time is the currency.</p></div></div>
  <div class="wallet" id="wallet" hidden><div><div class="meta" id="who"></div><div><span class="num" id="bal">–</span> <span class="meta">hours</span></div></div><button class="btn ghost" id="logout">Switch</button></div>
</header>

<main>
  <section>
    <h2>Skills on offer</h2>
    <div class="bar"><input id="q" placeholder="Search guitar, yoga, cooking…"></div>
    <div class="chips" id="chips"></div>
    <div id="offers"></div>
  </section>
  <aside>
    <div>
      <h2>Offer a skill</h2>
      <form id="offerForm">
        <input name="title" placeholder="What can you teach or help with?" maxlength="80" required>
        <textarea name="description" rows="2" placeholder="A line about it (optional)" maxlength="300"></textarea>
        <div class="row"><select name="category" id="catSel"></select>
        <select name="hours"><option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option></select></div>
        <button class="btn" type="submit">Share with neighbours</button>
      </form>
    </div>
    <div><h2>Your activity</h2><ul id="mine"></ul></div>
    <div><h2>Top neighbours</h2><ul id="board"></ul></div>
  </aside>
</main>

<dialog id="login"><form method="dialog" id="loginForm">
  <h2>Welcome to TimeBank</h2><p class="meta">Pick a name. New members get 3 free hours to start.</p>
  <input id="nameIn" placeholder="Your name" maxlength="40" required autofocus>
  <button class="btn">Join</button></form></dialog>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,cat='',cats=[];
try{me=localStorage.getItem('tb_name')}catch(e){}

async function api(path,opt){
  const r=await fetch('/api/'+path,opt&&opt.body?{method:opt.method||'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(opt.body)}:opt);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Something went wrong');
  return j;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800)}

async function refreshWallet(){
  const m=await api('ledger/members/'+encodeURIComponent(me));
  $('#bal').textContent=m.balance;$('#who').textContent='Hi, '+me;$('#wallet').hidden=false;
}
async function loadOffers(){
  const p=new URLSearchParams();if(cat)p.set('category',cat);if($('#q').value)p.set('q',$('#q').value);
  const list=await api('skills/offers?'+p);
  $('#offers').innerHTML=list.length?list.map(o=>`
    <div class="offer"><div><h3>${esc(o.title)}</h3></div>
    <div class="right"><span class="hrs">${o.hours}h</span>
      ${o.member.toLowerCase()===me.toLowerCase()?`<button class="btn ghost" data-del="${o.id}">Remove</button>`:`<button class="btn" data-book="${o.id}">Book</button>`}</div>
    <p>${esc(o.description||'')}</p><div class="meta">${esc(o.category)} · by ${esc(o.member)}</div></div>`).join(''):'<p class="empty">Nothing here yet. Be the first to offer something!</p>';
}
async function loadSide(){
  const [mine,board]=await Promise.all([api('ledger/transactions?member='+encodeURIComponent(me)),api('ledger/leaderboard')]);
  $('#mine').innerHTML=mine.length?mine.map(t=>t.learner===me?`<li>Learned <b>${esc(t.offer_title)}</b> from ${esc(t.provider)} <span class="meta">(−${t.hours}h)</span></li>`:`<li>Taught <b>${esc(t.offer_title)}</b> to ${esc(t.learner)} <span class="meta">(+${t.hours}h)</span></li>`).join(''):'<li class="empty">No bookings yet.</li>';
  $('#board').innerHTML=board.length?board.map((b,i)=>`<li>${i+1}. ${esc(b.name)} <span class="meta">· ${b.hours_given}h given</span></li>`).join(''):'<li class="empty">Be the first on the board.</li>';
}
async function all(){await Promise.all([refreshWallet(),loadOffers(),loadSide()])}

function renderChips(){
  $('#chips').innerHTML=['All',...cats].map(c=>`<button class="chip ${(c==='All'?'':c)===cat?'on':''}" data-cat="${c==='All'?'':esc(c)}">${esc(c)}</button>`).join('');
}
$('#chips').onclick=e=>{if(e.target.dataset.cat===undefined)return;cat=e.target.dataset.cat;renderChips();loadOffers()};
let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(loadOffers,250)};
$('#offers').onclick=async e=>{
  const b=e.target;
  try{
    if(b.dataset.book){b.disabled=true;const r=await api('ledger/bookings',{body:{learner:me,offer_id:+b.dataset.book}});toast(`Booked! ${r.provider} will be in touch. Balance: ${r.balance}h`);await all()}
    if(b.dataset.del){await api(`skills/offers/${b.dataset.del}?member=${encodeURIComponent(me)}`,{method:'DELETE'});loadOffers()}
  }catch(err){toast(err.message);b.disabled=false}
};
$('#offerForm').onsubmit=async e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  try{await api('skills/offers',{body:{...f,hours:+f.hours,member:me}});e.target.reset();toast('Skill shared!');loadOffers()}catch(err){toast(err.message)}
};
$('#logout').onclick=()=>{try{localStorage.removeItem('tb_name')}catch(e){}location.reload()};
$('#loginForm').onsubmit=()=>{me=$('#nameIn').value.trim();try{localStorage.setItem('tb_name',me)}catch(e){}start()};

async function start(){
  cats=await api('skills/categories');renderChips();
  $('#catSel').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');
  try{await all()}catch(e){toast(e.message)}
}
if(me)start();else{cats=[];$('#login').showModal()}
</script>
</body>
</html>
