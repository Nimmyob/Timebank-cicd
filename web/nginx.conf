server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/skills/ { proxy_pass http://skills:5001/; proxy_set_header Host $host; }
  location /api/ledger/ { proxy_pass http://ledger:5002/; proxy_set_header Host $host; }
  location = /healthz   { return 200 "ok"; }
  location /            { try_files $uri /index.html; }
}
