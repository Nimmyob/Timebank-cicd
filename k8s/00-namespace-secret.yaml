apiVersion: v1
kind: Namespace
metadata: { name: timebank }
---
apiVersion: v1
kind: Secret
metadata: { name: db-credentials, namespace: timebank }
type: Opaque
stringData:                       # CHANGE the password before any real deployment
  POSTGRES_USER: timebank
  POSTGRES_PASSWORD: change-me
  SKILLS_DATABASE_URL: postgresql://timebank:change-me@postgres:5432/skills
  LEDGER_DATABASE_URL: postgresql://timebank:change-me@postgres:5432/ledger
---
apiVersion: v1
kind: ConfigMap
metadata: { name: db-init, namespace: timebank }
data:
  init.sql: |
    CREATE DATABASE skills;
    CREATE DATABASE ledger;
