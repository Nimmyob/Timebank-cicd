# Enforce the tiers: only app-tier pods may reach the DB; only web may reach the app tier.
# (Needs a CNI that enforces NetworkPolicy, e.g. Calico/Cilium. Ignored harmlessly otherwise.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: db-only-from-app, namespace: timebank }
spec:
  podSelector: { matchLabels: { tier: data } }
  ingress: [{ from: [{ podSelector: { matchLabels: { tier: app } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: app-only-from-web-and-peers, namespace: timebank }
spec:
  podSelector: { matchLabels: { tier: app } }
  ingress:
    - from:
        - podSelector: { matchLabels: { tier: web } }
        - podSelector: { matchLabels: { tier: app } }
