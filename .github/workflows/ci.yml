name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [skills, ledger]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -v

  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: |
          python - <<'PY'
          import glob, yaml
          for f in sorted(glob.glob("k8s/*.yaml")):
              docs = [d for d in yaml.safe_load_all(open(f)) if d]
              assert docs, f"{f} is empty"
              print(f, len(docs), "documents OK")
          PY

  build-and-push:
    name: Build and push ${{ matrix.service }} image
    needs: [test, validate-k8s]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [skills, ledger, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/timebank-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/timebank-${{ matrix.service }}:${{ github.sha }}
